<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Dev Min Su</title>

<style>
:root{
  color-scheme:dark;
  --ink:#edf6ff;
  --green:#79d4ff;
  --muted:#a1b3c9;
  --paper:#0b1422
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#08090b;
  color:var(--ink);
  font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif
}

.app{
  width:100%;
  max-width:450px;
  min-height:100svh;
  margin:auto;
  background:#08090b;
  padding:calc(32px + env(safe-area-inset-top)) 32px calc(32px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

header h1{
  font-size:17px;
  font-weight:500;
  letter-spacing:-.4px;
  margin:0;
  color:#f5f5f7
}

.badge{
  border:0;
  background:none;
  padding:0;
  color:#96969e;
  font-size:13px;
  letter-spacing:.5px
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  padding:0
}

.machine{
  border:0;
  border-radius:0;
  background:none;
  box-shadow:none;
  margin:0 0 28px;
  padding:0;
  width:100%;
  position:relative
}

.machine:before,
.machine:after{
  content:none
}

.window{
  height:200px;
  overflow:hidden;
  position:relative;
  mask-image:linear-gradient(
    to right,
    transparent,
    #000 18%,
    #000 82%,
    transparent
  )
}

.reel{
  display:flex;
  width:100%;
  will-change:transform
}

.number{
  flex:0 0 100%;
  min-width:0;
  height:200px;
  line-height:200px;
  font-size:clamp(112px,34vw,152px);
  font-weight:400;
  letter-spacing:-8px;
  color:#f5f5f7;
  text-shadow:none;
  font-variant-numeric:tabular-nums;
  text-align:center
}

.controls{
  margin:0;
  width:100%;
  display:flex;
  justify-content:center
}

button{
  width:180px;
  min-height:56px;
  border:0;
  border-radius:999px;
  background:#8bd6ff;
  color:#071a27;
  font-size:17px;
  font-weight:600;
  font-family:system-ui,'Apple SD Gothic Neo',sans-serif;
  cursor:pointer;
  box-shadow:none;
  transition:background .2s,transform .2s;
  touch-action:manipulation
}

button:hover:not(:disabled){
  background:#afe3ff
}

button:active:not(:disabled){
  transform:scale(.98)
}

button:focus-visible{
  outline:3px solid #173b2c;
  outline-offset:5px
}

button:disabled{
  cursor:wait;
  background:#263b48;
  color:#a9c5d6
}

.status{
  position:absolute;
  width:1px;
  height:1px;
  min-height:0;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap
}

.saved{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:8px;
  margin:0 0 36px;
  padding:0;
  list-style:none;
  width:100%
}

.saved li{
  font-size:clamp(22px,6vw,28px);
  font-weight:500;
  line-height:44px;
  font-variant-numeric:tabular-nums;
  color:#464951
}

.saved li.filled{
  background:linear-gradient(
    100deg,
    #ff9eaf,
    #b6a7ff,
    #88d8ff,
    #9ce8bd,
    #ff9eaf
  );
  background-size:300% 100%;
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  animation:rgb-flow 16s ease-in-out infinite alternate
}

@keyframes rgb-flow{
  from{
    background-position:0% 50%
  }

  to{
    background-position:100% 50%
  }
}

.storage-note{
  font-size:12px;
  color:#a1b3c9;
  margin:16px 0 0
}

.storage-note:empty{
  display:none
}

@media(min-width:600px){
  body{
    padding:0
  }

  .app{
    min-height:100svh;
    box-shadow:none
  }
}

@media(max-height:560px){
  .machine{
    margin-bottom:24px
  }

  .app{
    padding-top:20px;
    padding-bottom:20px
  }
}

@media(prefers-reduced-motion:reduce){
  button{
    transition:none
  }

  .saved li.filled{
    animation:none
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Dev Min Su</h1>
</header>

<main>

<div class="machine" aria-hidden="true">
  <div class="window">
    <div class="reel" id="reel">
      <div class="number">1</div>
    </div>
  </div>
</div>

<p
  class="status"
  id="status"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  준비되셨나요?
</p>

<ol
  class="saved"
  id="saved"
  aria-label="저장된 추첨 번호 6자리"
></ol>

<div class="controls">
  <button type="button" id="draw">추첨</button>
</div>

</main>

</div>

<script>
'use strict';

const reel = document.getElementById('reel');
const button = document.getElementById('draw');
const status = document.getElementById('status');
const savedList = document.getElementById('saved');

const storageKey = 'dev-min-su-picks-v1';

let picks = [];

try {
  const stored = JSON.parse(
    localStorage.getItem(storageKey) || '[]'
  );

  if (
    Array.isArray(stored) &&
    stored.length <= 6 &&
    stored.every(
      n =>
        Number.isInteger(n) &&
        n >= 1 &&
        n <= 45
    ) &&
    new Set(stored).size === stored.length
  ) {
    picks = stored;
  }
} catch (_) {
}

function renderSaved() {
  savedList.replaceChildren(
    ...Array.from({ length: 6 }, (_, i) => {

      const item = document.createElement('li');

      item.textContent =
        picks[i] === undefined
          ? '·'
          : String(picks[i]);

      item.className =
        picks[i] === undefined
          ? ''
          : 'filled';

      item.style.animationDelay =
        `${-i * 1.2}s`;

      item.setAttribute(
        'aria-label',
        `${i + 1}번째: ${
          picks[i] === undefined
            ? '빈 자리'
            : picks[i] + '번'
        }`
      );

      return item;
    })
  );
}

function savePicks() {
  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(picks)
    );
  } catch (_) {
  }

  renderSaved();
}

let current =
  picks.length
    ? picks[picks.length - 1]
    : 1;

reel.replaceChildren(
  numberElement(current)
);

renderSaved();

let busy = false;


/*
 * 중복 없는 번호 생성
 *
 * 현재 picks에 이미 들어있는 번호를
 * 후보에서 제외한 뒤 하나를 선택합니다.
 */
function randomNumber() {

  const available = [];

  for (let number = 1; number <= 45; number++) {

    if (!picks.includes(number)) {
      available.push(number);
    }

  }

  if (available.length === 0) {
    throw new Error('사용 가능한 번호가 없습니다.');
  }

  const buffer = new Uint32Array(1);

  /*
   * rejection sampling을 사용해서
   * random % length 편향을 방지합니다.
   */
  const range = available.length;

  const limit =
    Math.floor(4294967296 / range) * range;

  do {
    crypto.getRandomValues(buffer);
  } while (buffer[0] >= limit);

  return available[buffer[0] % range];
}


function numberElement(value) {

  const element =
    document.createElement('div');

  element.className = 'number';
  element.textContent = value;

  return element;
}


button.addEventListener(
  'click',
  async () => {

    if (busy) {
      return;
    }

    busy = true;
    button.disabled = true;
    button.textContent = '추첨 중…';

    status.textContent =
      '행운의 번호를 고르고 있어요…';

    let animation;

    try {

      /*
       * 이미 6개가 완성되어 있다면
       * 새로운 6개 세트를 시작합니다.
       */
      if (picks.length >= 6) {

        picks = [];
        savePicks();

        current = 1;
      }

      /*
       * 현재 저장된 번호를 제외한
       * 새로운 번호를 가져옵니다.
       */
      const result = randomNumber();

      /*
       * 현재 번호에서 result까지
       * 자연스럽게 이동하도록 계산합니다.
       */
      const steps =
        45 * 5 +
        (result - current + 45) % 45;

      const fragment =
        document.createDocumentFragment();

      for (let i = 0; i <= steps; i++) {

        fragment.appendChild(
          numberElement(
            ((current - 1 + i) % 45) + 1
          )
        );

      }

      reel.replaceChildren(fragment);

      const reduced =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        !reduced &&
        typeof reel.animate === 'function'
      ) {

        animation = reel.animate(
          [
            {
              transform: 'translateX(0)'
            },
            {
              transform:
                `translateX(-${steps * 100}%)`
            }
          ],
          {
            duration: 3600,
            easing:
              'cubic-bezier(0.12, 0.65, 0.18, 1)',
            fill: 'forwards'
          }
        );

        await animation.finished;
      }

      current = result;

      if (animation) {
        animation.cancel();
      }

      reel.replaceChildren(
        numberElement(current)
      );

      /*
       * 중복 검증 후 저장
       */
      if (!picks.includes(current)) {
        picks.push(current);
      }

      savePicks();

      status.textContent =
        `${current}번. 저장된 번호 ${picks.join(', ')}.` +
        (
          picks.length === 6
            ? ' 다음 추첨부터 새로운 6개를 저장합니다.'
            : ''
        );

    } catch (error) {

      if (animation) {
        animation.cancel();
      }

      reel.replaceChildren(
        numberElement(current)
      );

      status.textContent =
        '추첨하지 못했어요. 다시 눌러 주세요.';

      console.error(error);

    } finally {

      busy = false;
      button.disabled = false;
      button.textContent = '추첨';

    }
  }
);
</script>

</body>
</html>
```
